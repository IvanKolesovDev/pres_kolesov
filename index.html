<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Extrusion</title><meta name="color-scheme" content="dark">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#0a0c11;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{background:radial-gradient(1200px 700px at 20% 10%,#1b2230,transparent),radial-gradient(900px 600px at 90% 90%,#2a1710,transparent),#0a0c11}
.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:60px 60px;animation:gm 6s linear infinite}
@keyframes gm{to{background-position:60px 0,60px 0}}
.glow{position:fixed;width:50vmax;height:50vmax;border-radius:50%;filter:blur(90px);opacity:.28;animation:gl 14s ease-in-out infinite alternate}
.g1{background:#ff5a1f;left:-15vmax;top:-20vmax}.g2{background:#2f7bff;right:-18vmax;bottom:-25vmax;animation-delay:-7s}
@keyframes gl{to{transform:translate(8vmax,6vmax) scale(1.2)}}
.slide{position:fixed;inset:0;display:none}
.slide.active{display:block;animation:fadein .8s both}
.slide svg{width:100%;height:100%}
svg *{transform-box:fill-box;transform-origin:center}
.paused *{animation-play-state:paused!important}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(30px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes drift{50%{transform:translateY(-14px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{transform:translateX(-200px)}}
@keyframes fall{0%{opacity:0;transform:translateY(0)}10%,90%{opacity:1}100%{opacity:0;transform:translateY(var(--h,360px))}}
@keyframes up{0%{opacity:0;transform:translateY(0)}50%{opacity:.7}100%{opacity:0;transform:translateY(-70px)}}
@keyframes heat{to{opacity:.7}}
@keyframes slide{to{transform:translateX(170px)}}
@keyframes needle{from{transform:rotate(-70deg)}to{transform:rotate(62deg)}}
@keyframes qm{0%{opacity:0;transform:scale(.5)}15%,80%{opacity:1;transform:none}100%{opacity:0;transform:scale(1.4)}}
@keyframes wig{50%{transform:translateX(34px) rotate(-8deg)}}
@keyframes ring{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
@keyframes cyA{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
@keyframes cyB{0%,45%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
@keyframes conf{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:1;transform:translateY(1000px) rotate(720deg)}}
@keyframes dash{to{stroke-dashoffset:-60}}
@keyframes shine{0%{opacity:0}50%{opacity:.5}100%{opacity:0}}
.p{opacity:0;animation:pop .8s var(--d,0s) both cubic-bezier(.2,1.3,.4,1)}
.g{transform-origin:0 50%;animation:grow var(--t,1s) var(--d,0s) both ease-out}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1s) var(--d,0s) forwards linear}
.df{animation:drift 4s ease-in-out infinite}
.sp{animation:spin 3s linear var(--d,0s) infinite}
.fl{animation:fall 2.4s var(--d,0s) infinite both linear}
.h{opacity:0;animation:heat 6s var(--d,0s) forwards}
.u{animation:up 2.2s var(--d,0s) infinite both}
.ui{position:fixed;left:0;right:0;bottom:0;padding:0 0 calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:10px;z-index:5}
.dot{width:46px;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;cursor:pointer}
.dot i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb347,#ff5a1f)}
#ov{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:rgba(8,10,14,.55);backdrop-filter:blur(6px);cursor:pointer;transition:opacity .4s}
#ov.off{opacity:0;pointer-events:none}
#ov div{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#ffb347,#ff5a1f);display:flex;align-items:center;justify-content:center;box-shadow:0 0 80px rgba(255,90,31,.6);animation:drift 2.5s infinite}
#ov svg{width:50px;height:50px;margin-left:8px}
</style></head><body>
<div class="grid"></div><div class="glow g1"></div><div class="glow g2"></div>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="hot" x1="0" x2="1"><stop offset="0" stop-color="#ffc15e"/><stop offset="1" stop-color="#ff5a1f"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a95a5"/><stop offset=".5" stop-color="#4a5360"/><stop offset="1" stop-color="#2a3039"/></linearGradient>
<linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="760" x2="1450"><stop offset="0" stop-color="#ffb347"/><stop offset=".3" stop-color="#ff6a2a"/><stop offset=".65" stop-color="#6aa8ff"/><stop offset="1" stop-color="#2f7bff"/></linearGradient>
<clipPath id="bc"><rect x="380" y="470" width="820" height="170" rx="30"/></clipPath>
<clipPath id="bt"><rect x="170" y="240" width="1430" height="420"/></clipPath>
<pattern id="scr" width="70" height="170" patternUnits="userSpaceOnUse"><path d="M0 170L70 0" stroke="#c9d2de" stroke-width="16"/></pattern>
</defs></svg>

<!-- 1 TITLE (15s) -->
<section class="slide"><svg viewBox="0 0 1600 900">
<rect x="230" y="470" width="50" height="140" rx="10" fill="url(#metal)" class="p" style="--d:.3s"/>
<rect x="280" y="512" width="1090" height="56" rx="10" fill="url(#hot)" class="g" style="--d:2s;--t:4s"/>
<text x="800" y="400" text-anchor="middle" font-size="190" font-weight="800" letter-spacing="14" fill="url(#hot)" class="p" style="--d:.8s">EXTRUSION</text>
<g class="df" fill="none" stroke-width="16"><circle cx="300" cy="250" r="40" stroke="#2f7bff" class="p" style="--d:3s"/><circle cx="1300" cy="700" r="50" stroke="#3ddc97" class="p" style="--d:4s"/><rect x="1230" y="190" width="80" height="80" rx="6" stroke="#ffb347" class="p" style="--d:5s"/></g>
</svg></section>

<!-- 2 MAIN FEATURE (48s) -->
<section class="slide"><svg viewBox="0 0 1600 900">
<text x="800" y="520" text-anchor="middle" font-size="300" font-weight="800" fill="url(#hot)" style="opacity:0;animation:qm 6.88s 0.38s both">?</text>
<g class="df"><g style="animation:wig 1.2s 11.25s 5 both" class="p"><g transform="rotate(-12 760 160)" style="--d:10.62s"><rect x="640" y="150" width="300" height="26" rx="13" fill="#e8eef7"/><rect x="900" y="120" width="70" height="30" rx="8" fill="#2f7bff"/><path d="M905 120v-26M925 120v-26M945 120v-26M965 120v-26" stroke="#fff" stroke-width="7" stroke-linecap="round"/></g></g></g>
<g class="p" style="--d:7.5s">
<rect x="170" y="370" width="360" height="160" rx="28" fill="#e8eef7"/><rect x="170" y="410" width="360" height="24" fill="#2f7bff"/>
<rect x="530" y="422" width="52" height="56" rx="8" fill="#ff5a1f"/>
<rect x="120" y="350" width="44" height="200" rx="14" fill="url(#hot)" style="animation:slide 11.25s 18.75s forwards ease-in-out"/></g>
<path d="M580 450C720 450 760 560 900 560S1120 380 1260 430 1440 520 1540 470" pathLength="1" fill="none" stroke="#bff7e0" stroke-width="46" stroke-linecap="round" class="dr" style="--d:18.75s;--t:11.25s"/>
<path d="M580 450C720 450 760 560 900 560S1120 380 1260 430 1440 520 1540 470" pathLength="1" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="10" stroke-linecap="round" class="dr" style="--d:18.75s;--t:11.25s"/>
<circle cx="582" cy="450" r="30" fill="none" stroke="#ffb347" stroke-width="6" style="animation:ring 1.3s 33.75s infinite both"/>
<polygon points="590,690 640,660 640,720" fill="#7fe3ff" class="p" style="--d:42.5s"/>
<rect x="620" y="687" width="900" height="6" rx="3" fill="#7fe3ff" class="g" style="--d:42.5s;--t:7.5s"/>
<polygon points="1560,690 1510,660 1510,720" fill="#7fe3ff" class="p" style="--d:49.38s"/>
<g fill="none" stroke="url(#hot)" stroke-width="18" id="c2"></g>
</svg></section>

<!-- 3 EXTRUDER (42s) -->
<section class="slide"><svg viewBox="0 0 1600 900">
<g class="p" style="--d:2.98s">
<polygon points="200,180 440,180 360,470 280,470" fill="url(#metal)" stroke="#8a95a5" stroke-width="4"/>
<rect x="380" y="470" width="820" height="170" rx="30" fill="url(#metal)"/>
<g clip-path="url(#bc)"><rect x="300" y="470" width="1000" height="170" fill="url(#scr)" style="animation:flow 1.2s 28.57s linear infinite both;--x:70px"/></g>
<rect x="380" y="470" width="820" height="170" rx="30" fill="url(#hot)" class="h" style="--d:20.24s;mix-blend-mode:screen"/>
<rect x="1200" y="450" width="50" height="210" rx="10" fill="url(#metal)"/>
<rect x="190" y="480" width="100" height="150" rx="14" fill="#2a3039"/>
<circle cx="240" cy="555" r="38" fill="none" stroke="#c9d2de" stroke-width="14" stroke-dasharray="12 12" class="sp" style="--d:28.57s"/>
<g transform="translate(790 300)"><circle r="82" fill="#161b24" stroke="#5b6572" stroke-width="8"/><path d="M-60 40A74 74 0 0 1 60 40" fill="none" stroke="#3ddc97" stroke-width="10" stroke-dasharray="60 40 70"/><line x1="0" y1="0" x2="0" y2="-62" stroke="#ff5a1f" stroke-width="8" stroke-linecap="round" style="transform-box:view-box;transform-origin:790px 300px;transform:rotate(-70deg);animation:needle 9.52s 33.33s forwards ease-out"/><circle r="10" fill="#e8eef7"/></g>
<rect x="1250" y="522" width="320" height="76" rx="12" fill="url(#hot)" class="g" style="--d:39.29s;--t:7.14s"/>
</g>
<g id="pel"></g>
<g fill="none" stroke="#ffb347" stroke-width="8" stroke-linecap="round"><path d="M500 440q20-20 0-40t0-40" class="u" style="--d:20.24s"/><path d="M700 440q20-20 0-40t0-40" class="u" style="--d:21.07s"/><path d="M900 440q20-20 0-40t0-40" class="u" style="--d:21.9s"/><path d="M1100 440q20-20 0-40t0-40" class="u" style="--d:22.74s"/></g>
</svg></section>

<!-- 4 DIE (50s) -->
<section class="slide"><svg viewBox="0 0 1600 900">
<rect x="250" y="410" width="400" height="80" fill="url(#hot)" class="g" style="--d:20.9s;--t:1.1s"/>
<g fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="8" stroke-linecap="round"><path d="M300 430l30 20-30 20M380 430l30 20-30 20" style="opacity:0;animation:flow 1s 22s infinite linear both"/></g>
<g class="p" style="--d:4.4s"><rect x="640" y="230" width="120" height="440" rx="16" fill="url(#metal)" style="filter:drop-shadow(0 0 30px rgba(255,179,71,.35))"/><rect x="640" y="410" width="120" height="80" fill="#10141b"/></g>
<rect x="760" y="412" width="700" height="76" rx="14" fill="url(#bar)" class="g" style="--d:23.1s;--t:6.6s"/>
<g class="p" style="--d:16.5s"><circle cx="360" cy="230" r="120" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.2)" stroke-width="3"/>
<circle cx="360" cy="230" r="66" fill="none" stroke="#2f7bff" stroke-width="30" style="animation:cyA 12s 25.3s infinite"/>
<polygon class="star" data-c="360,230,84,40,10" fill="#ffb347" style="opacity:0;animation:cyB 12s 25.3s infinite"/></g>
<g id="drops"></g>
<g stroke="#7fe3ff" stroke-width="6" stroke-linecap="round" fill="none" stroke-dasharray="40 20"><path d="M900 590h500" style="opacity:0;animation:dash 1s 45.1s infinite linear both,fadein 1s 45.1s forwards"/><path d="M960 630h440" style="opacity:0;animation:dash 1.3s 45.1s infinite linear both,fadein 1s 45.1s forwards"/></g>
<rect x="1000" y="400" width="450" height="100" rx="20" fill="#fff" style="opacity:0;animation:shine 2s 50.6s both"/>
</svg></section>

<!-- 5 EXAMPLES (34s) -->
<section class="slide"><svg viewBox="0 0 1600 900">
<g style="animation:qm 12.5s 0.29s both"><polygon points="560,470 800,260 1040,470" fill="url(#hot)"/><rect x="600" y="470" width="400" height="230" fill="#e8eef7"/><rect x="760" y="560" width="80" height="140" fill="#ff5a1f"/><circle cx="1100" cy="300" r="22" fill="#ffb347" class="df"/></g>
<g id="cards"></g>
<g class="p df" style="--d:13.24s" fill="none" stroke-width="24"><circle cx="270" cy="520" r="52" stroke="#2f7bff"/><circle cx="390" cy="520" r="52" stroke="#ff5a1f"/><circle cx="330" cy="415" r="52" stroke="#3ddc97"/></g>
<g class="p" style="--d:20.59s"><rect x="690" y="330" width="220" height="250" rx="10" fill="rgba(127,227,255,.2)" stroke="#f3f6fb" stroke-width="22"/><path d="M800 340v230M700 455h200" stroke="#f3f6fb" stroke-width="14"/><rect x="720" y="360" width="30" height="190" fill="#fff" style="animation:shine 3s 22.06s infinite both"/></g>
<g class="p df" style="--d:29.41s" fill="none" stroke-linecap="round"><path d="M1190 540V470Q1190 420 1240 420H1290" stroke="#ffd36e" stroke-width="38"/><path d="M1190 540V470Q1190 420 1240 420H1290" stroke="#c9902f" stroke-width="10"/><path d="M1350 500V440Q1350 390 1300 390" stroke="#ffd36e" stroke-width="38"/><path d="M1350 500V440Q1350 390 1300 390" stroke="#c9902f" stroke-width="10"/><path d="M1180 620q40-30 80 0t80 0t80 0" stroke="#ffe3a0" stroke-width="10" stroke-dasharray="1" style="stroke-dasharray:20 8"/></g>
</svg></section>

<!-- 6 SUMMARY (32s) -->
<section class="slide"><svg viewBox="0 0 1600 900">
<rect x="100" y="250" width="70" height="400" rx="14" fill="url(#metal)" class="p" style="--d:1.41s"/>
<g clip-path="url(#bt)" id="belts"></g>
<g class="p df" style="--d:36.56s"><circle cx="800" cy="130" r="80" fill="url(#hot)"/><text x="800" y="168" text-anchor="middle" font-size="110" font-weight="800" fill="#fff">?</text></g>
<g id="conf"></g>
</svg></section>

<div class="ui" id="ui"></div>
<div id="ov"><div><svg viewBox="0 0 24 24"><path d="M6 3l15 9-15 9z" fill="#fff"/></svg></div></div>
<script>
const D=[15,60,50,55,50,45],N=D.length,S=[...document.querySelectorAll('.slide')],ns='http://www.w3.org/2000/svg';
const E=(t,a,p)=>{const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const star=(cx,cy,R,r,n)=>Array.from({length:n*2},(_,k)=>{const a=-Math.PI/2+k*Math.PI/n,q=k%2?r:R;return(cx+q*Math.cos(a)).toFixed(1)+','+(cy+q*Math.sin(a)).toFixed(1)}).join(' ');
document.querySelectorAll('.star').forEach(e=>{const[c,d,R,r,n]=e.dataset.c.split(',').map(Number);e.setAttribute('points',star(c,d,R,r,n))});
// slide 2 identical circles
for(let k=0;k<8;k++){const c=E('circle',{cx:640+k*120,cy:790,r:34,class:'p'},document.getElementById('c2'));c.style.setProperty('--d',(41*1.25+k*.75)+'s')}
// slide 3 pellets
const pel=document.getElementById('pel');for(let k=0;k<14;k++){const c=E('circle',{cx:250+(k*37)%150+20,cy:100,r:11,fill:k%3?'#e8eef7':'#ffb347',class:'fl'},pel);c.style.setProperty('--d',(6*1.19+k*.48)+'s');c.style.setProperty('--h','350px')}
// slide 4 drops
const dr=document.getElementById('drops');for(let k=0;k<9;k++){const c=E('circle',{cx:1000+k*50,cy:260,r:8,fill:'#7fe3ff',class:'fl'},dr);c.style.setProperty('--d',(37*1.1+k*.33)+'s');c.style.setProperty('--h','140px')}
// slide 5 cards
const cd=document.getElementById('cards');[[130,13.2],[600,20.6],[1070,29.4]].forEach(([x,d])=>{const r=E('rect',{x,y:240,width:400,height:480,rx:36,fill:'rgba(255,255,255,.06)',stroke:'rgba(255,255,255,.2)','stroke-width':3,class:'p'},cd);r.style.setProperty('--d',(d-.5)+'s')});
// slide 6 conveyor
const bl=document.getElementById('belts');[330,450,570].forEach((y,ri)=>{E('rect',{x:170,y:y+62,width:1430,height:5,rx:3,fill:'rgba(255,255,255,.15)'},bl);const g=E('g',{class:'p'},bl);g.style.setProperty('--d',(3.5+ri*.85)+'s');const m=E('g',{style:'animation:flow 1.6s linear infinite'},g);
for(let k=0;k<9;k++){const x=250+k*200;
if(ri==0)E('circle',{cx:x,cy:y,r:40,fill:'none',stroke:'#2f7bff','stroke-width':18},m);
if(ri==1)E('polygon',{points:star(x,y,50,24,8),fill:'#ffb347'},m);
if(ri==2){E('rect',{x:x-40,y:y-40,width:80,height:80,rx:6,fill:'rgba(127,227,255,.2)',stroke:'#f3f6fb','stroke-width':12},m);E('path',{d:`M${x} ${y-40}v80M${x-40} ${y}h80`,stroke:'#f3f6fb','stroke-width':8},m)}}});
// confetti
const cf=document.getElementById('conf'),cl=['#ffb347','#ff5a1f','#2f7bff','#3ddc97','#7fe3ff'];
for(let k=0;k<26;k++){const r=E('rect',{x:(k*61)%1560+20,y:-40,width:14,height:22,fill:cl[k%5],style:'opacity:0;animation:conf '+(3.5+k%4*.6)+'s '+(28*1.41+(k%9)*.42)+'s infinite both linear'},cf)}
// player
const ui=document.getElementById('ui'),dots=D.map((_,k)=>{const d=document.createElement('div');d.className='dot';d.innerHTML='<i></i>';d.onclick=e=>{e.stopPropagation();show(k)};ui.appendChild(d);return d});
let i=0,t=0,play=false,last=0;
function show(n){i=Math.max(0,Math.min(N-1,n));t=0;S.forEach((s,k)=>s.classList.toggle('active',k==i))}
function setPlay(v){play=v;document.body.classList.toggle('paused',!v);document.getElementById('ov').classList.toggle('off',v)}
function tick(ts){const dt=Math.min((ts-last)/1000,.1);last=ts;
if(play){t+=dt;if(t>=D[i]){if(i<N-1)show(i+1);else t=D[i]}}
dots.forEach((d,k)=>d.firstChild.style.width=(k<i?100:k==i?t/D[i]*100:0)+'%');requestAnimationFrame(tick)}
document.addEventListener('keydown',e=>{if(e.key=='ArrowRight'||e.key=='PageDown')show(i+1);else if(e.key=='ArrowLeft'||e.key=='PageUp')show(i-1);else if(e.key==' '){e.preventDefault();setPlay(!play)}else if(e.key=='f'||e.key=='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}});
document.getElementById('ov').onclick=()=>setPlay(true);
document.querySelector('body').addEventListener('click',e=>{if(!e.target.closest('#ov,.dot'))setPlay(!play)});
show(0);setPlay(false);requestAnimationFrame(tick);
</script></body></html>
